# Run the complete Cheddar-enabled test suite locally on a Sky GPU. Bazel's
# common configuration still uses the BuildBuddy remote cache.
#
# Usage: sky launch -y -c heir-test-cheddar sky/test_cheddar.yaml

name: heir-test-cheddar

workdir: .

resources:
  accelerators: A10G:1
  cpus: 16+
  memory: 64+
  disk_size: 200
  cloud: aws
  image_id: docker:nvidia/cuda:12.9.1-cudnn-devel-ubuntu24.04
  autostop:
    idle_minutes: 10

setup: |
  set -ex
  apt-get update -qq
  apt-get install -y -qq git wget libcusparselt0
  if ! command -v bazel &> /dev/null; then
    wget -q https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -O /usr/local/bin/bazel
    chmod +x /usr/local/bin/bazel
  fi

run: |
  set -ex
  bazel fetch //... --config=cheddar --remote_executor=
  bazel build //... --config=cheddar --remote_executor=
  bazel test //... --config=cheddar \
    --remote_executor= --strategy=TestRunner=local --local_test_jobs=4 \
    --test_output=errors
